<!doctype html>
<html lang="fr" translate="no" class="notranslate">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="google" content="notranslate" />
    <meta http-equiv="Content-Language" content="fr" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="theme-color" content="#0e0e10" media="(prefers-color-scheme: dark)" />
    <title>Flashcards • CapECL</title>

    <link rel="icon" type="image/png" href="./favicon-96x96.png?v=20260826" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=20260826" />
    <link rel="shortcut icon" href="./favicon.ico?v=20260826" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=20260826" />
    <meta name="apple-mobile-web-app-title" content="CapECL" />
    <link rel="manifest" href="./site.webmanifest?v=20260826" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://cloud.umami.is" crossorigin />
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="a052a820-83ee-48c6-bf8a-9b3c2b3a8fd3"
    ></script>

    <script type="module" crossorigin src="./assets/main-DK5FT2Ab.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/main-BQuTP_Nc.css">
  </head>
  <body>
    <div class="app-container">
      <header>
        <div class="header-content">
          <div class="header-brand">
            <a href="https://capecl.fr" class="site-logo" aria-label="Retour à l’accueil CAPECL">
              <picture>
                <img src="./assets/secondary-cropped-BlWxufp2.svg" alt="CAPECL" />
              </picture>
            </a>
            <h1>&nbsp;flashcards</h1>
          </div>
          <select id="chapterSelect" class="chapter-select" aria-label="Choisir un chapitre">
            <!-- options générées dynamiquement -->
          </select>
          <div class="header-actions">
            <div class="mode-toggle-wrapper">
              <button
                id="modeToggle"
                class="mode-toggle"
                title="Basculer entre mode lecture et révision"
                aria-label="Basculer le mode"
              >
                <span class="toggle-text">Lecture</span>
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="toggle-icon"
                >
                  <path d="M7 7h10v10" />
                  <path d="M7 17 17 7" />
                </svg>
              </button>
            </div>
            <div class="info-wrapper">
              <button
                id="infoBtn"
                class="info-btn"
                title="Afficher les raccourcis clavier"
                aria-label="Raccourcis clavier"
                aria-controls="helpTooltip"
                aria-expanded="false"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-info-icon lucide-info"
                >
                  <circle cx="12" cy="12" r="10" />
                  <path d="M12 16v-4" />
                  <path d="M12 8h.01" />
                </svg>
              </button>
              <div
                class="help-tooltip hidden"
                id="helpTooltip"
                role="dialog"
                aria-label="Raccourcis clavier"
                aria-hidden="true"
              >
                <p class="tooltip-title">Raccourcis clavier</p>
                <div class="tooltip-content">
                  <div class="shortcut">
                    <span>Naviguer</span>
                    <span class="shortcut-keys"><kbd>←</kbd><kbd>→</kbd></span>
                  </div>
                  <div class="shortcut">
                    <span>Retourner</span>
                    <span class="shortcut-keys"><kbd>Espace</kbd></span>
                  </div>
                  <div class="shortcut">
                    <span>Aléatoire</span>
                    <span class="shortcut-keys"><kbd>R</kbd></span>
                  </div>
                  <div class="shortcut">
                    <span>Favoris</span>
                    <span class="shortcut-keys"><kbd>F</kbd></span>
                  </div>
                  <div class="shortcut">
                    <span>Ajouter aux favoris</span>
                    <span class="shortcut-keys"><kbd>B</kbd></span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </header>

      <main class="main-content">
        <section class="stage" id="stage" aria-label="Carte mémoire">
          <!-- Zones dans lesquelles glisser les cartes du mode révision sur mobile -->
          <div class="swipe-zone swipe-zone-ok" aria-hidden="true">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-badge-check-icon lucide-badge-check swipe-zone-icon"
            >
              <path
                d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"
              />
              <path d="m9 12 2 2 4-4" />
            </svg>
          </div>
          <div class="swipe-zone swipe-zone-review" aria-hidden="true">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-badge-x-icon lucide-badge-x swipe-zone-icon"
            >
              <path
                d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"
              />
              <line x1="15" x2="9" y1="9" y2="15" />
              <line x1="9" x2="15" y1="9" y2="15" />
            </svg>
          </div>
          <div class="skeleton-card" id="skeleton"></div>
          <div class="card-shell" id="cardShell">
            <div
              class="card3d"
              id="card3d"
              aria-live="polite"
              tabindex="0"
              role="button"
              aria-pressed="false"
            >
              <div class="face front">
                <img id="frontImg" alt="Recto de la carte" draggable="false" />
              </div>
              <div class="face back">
                <img id="backImg" alt="Verso de la carte" draggable="false" />
              </div>
            </div>
          </div>
        </section>

        <div class="controls-wrapper">
          <div class="controls">
            <div class="nav-buttons">
              <button
                id="prevBtn"
                class="btn secondary"
                title="Carte précédente (←)"
                aria-label="Carte précédente"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-arrow-left-icon lucide-arrow-left btn-icon"
                >
                  <path d="m12 19-7-7 7-7" />
                  <path d="M19 12H5" />
                </svg>
                <span class="btn-text">Précédent</span>
              </button>

              <button
                id="bookmarkBtn"
                class="btn btn-bookmark"
                title="Ajouter/retirer des favoris (B)"
                aria-label="Ajouter aux favoris"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-bookmark-icon lucide-bookmark"
                >
                  <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z" />
                </svg>
                <span class="btn-text">Ajouter</span>
              </button>

              <button
                id="nextBtn"
                class="btn secondary"
                title="Carte suivante (→)"
                aria-label="Carte suivante"
              >
                <span class="btn-text">Suivant</span>
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-arrow-right-icon lucide-arrow-right btn-icon"
                >
                  <path d="M5 12h14" />
                  <path d="m12 5 7 7-7 7" />
                </svg>
              </button>

              <!-- Bouttons du mode révision (affichés uniquement en mode révision) -->
              <button
                id="pasOkBtn"
                class="btn btn-pas-ok"
                style="display: none"
                title="Marquer cette carte à revoir (←)"
                aria-label="À revoir"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-circle-x-icon lucide-circle-x btn-icon"
                >
                  <circle cx="12" cy="12" r="10" />
                  <path d="m15 9-6 6" />
                  <path d="m9 9 6 6" />
                </svg>
                <span class="btn-text">À revoir</span>
              </button>

              <button
                id="okBtn"
                class="btn btn-ok"
                style="display: none"
                title="Carte maîtrisée (→)"
                aria-label="Maîtrisé"
              >
                <span class="btn-text">Maîtrisé</span>
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-circle-check-icon lucide-circle-check btn-icon"
                >
                  <circle cx="12" cy="12" r="10" />
                  <path d="m9 12 2 2 4-4" />
                </svg>
              </button>
            </div>

            <div class="filter-controls">
              <div class="filter-group">
                <span class="filter-label">Timer</span>
                <div
                  class="traffic-pills"
                  id="timerFilter"
                  data-level="all"
                  role="button"
                  tabindex="0"
                  aria-label="Filtre timer"
                >
                  <div class="pill"></div>
                  <div class="pill"></div>
                  <div class="pill"></div>
                </div>
              </div>

              <div class="filter-group">
                <span class="filter-label">Difficulté</span>
                <div
                  class="traffic-pills"
                  id="difficultyFilter"
                  data-level="all"
                  role="button"
                  tabindex="0"
                  aria-label="Filtre difficulté"
                >
                  <div class="pill"></div>
                  <div class="pill"></div>
                  <div class="pill"></div>
                </div>
              </div>

              <div class="toggle-pair">
                <div
                  class="random-toggle"
                  id="randomToggle"
                  role="switch"
                  aria-checked="false"
                  tabindex="0"
                >
                  <div class="random-icon">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="20"
                      height="20"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <rect width="12" height="12" x="2" y="10" rx="2" ry="2" />
                      <path
                        d="m17.92 14 3.5-3.5a2.24 2.24 0 0 0 0-3l-5-4.92a2.24 2.24 0 0 0-3 0L10 6"
                      />
                      <path d="M6 18h.01" />
                      <path d="M10 14h.01" />
                      <path d="M15 6h.01" />
                      <path d="M18 9h.01" />
                    </svg>
                  </div>
                  <span class="random-label">Aléatoire</span>
                </div>

                <div
                  class="favourites-toggle"
                  id="favouritesToggle"
                  role="switch"
                  aria-checked="false"
                  tabindex="0"
                >
                  <div class="favourites-icon">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="20"
                      height="20"
                      viewBox="0 0 24 24"
                    >
                      <path
                        d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
                      />
                    </svg>
                  </div>
                  <span class="favourites-label">Favoris</span>
                  <span class="favourites-count" id="favouritesCount">0</span>
                </div>
              </div>
            </div>

            <div class="counter-wrapper">
              <span class="counter" id="counter">Chargement…</span>
              <button
                id="restartRevisionInlineBtn"
                class="btn-restart"
                style="display: none"
                title="Recommencer depuis le début"
                aria-label="Recommencer la révision"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-refresh-ccw"
                >
                  <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                  <path d="M3 3v5h5" />
                  <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
                  <path d="M16 16h5v5" />
                </svg>
                <span class="btn-restart-text">Reset</span>
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <footer class="footer-section">
      <div class="footer-content">
        <div class="footer-row">
          <a href="https://capecl.fr" class="footer-link" aria-label="Retour à l'accueil CAPECL">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
              <path
                d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
              />
            </svg>
            Accueil
          </a>
          <div class="footer-credits">
            <span
              >Site créé par
              <a
                href="https://pierrelouis.net/projects/capecl"
                target="_blank"
                rel="noopener noreferrer"
                >Pierre-Louis</a
              >, flashcards créées par
            </span>
            <a href="https://gitlab.com/capecl/y2" target="_blank" rel="noopener noreferrer"
              >B. Bernard</a
            >.
          </div>
          <a href="./terms/" class="footer-link footer-legal">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-scroll-text-icon lucide-scroll-text"
              aria-hidden="true"
            >
              <path d="M15 12h-5" />
              <path d="M15 8h-5" />
              <path d="M19 17V5a2 2 0 0 0-2-2H4" />
              <path
                d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3"
              />
            </svg>
            Mentions légales
          </a>
        </div>
      </div>
    </footer>
  </body>
</html>
